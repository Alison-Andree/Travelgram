<!doctype html>
<html lang="pt-br">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel gram</title>
    <link rel="stylesheet" href="/styles/index.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="bg-surface-color">
      <!--Navegação-->
      <nav class="container">
        <a href="#"
          ><img
            src="/assets/Logo.svg"
            alt="Logo com o nome travel gram escrita na cor laranja e um ícone de um globo no lado esquerdo"
        /></a>
        <ul>
          <li>
            <a href="#"></a
            ><img
              src="/assets/icons/MagnifyingGlass.svg"
              alt="Ícone de uma lupa para pesquisas"
            />
          </li>
          <li><a href="#"></a>Explorar</li>
          <li><a href="#"></a>Minhas viagens</li>
          <li>
            <a href="#"></a
            ><img src="/assets/Profile pic.png" alt="Foto de perfil" />
          </li>
        </ul>
      </nav>

      <!--Cabeçalho-->
      <nav class="container">
        <!--Informações pessoais-->
        <div id="profile">
          <img src="/assets/Profile pic.png" alt="Imagem de perfil" />
          <div>
            <h1>Isabela Torres</h1>
            <p>
              Amante de viagens, cultura e gastronomia. 🌍✈️ Aqui compartilho as
              histórias registradas em cada clique, explorando cantinhos
              fascinantes do nosso planeta a partir da movimentada cidade de São
              Paulo. 🏙️📸
            </p>
          </div>
        </div>

        <div id="info">
          <ul>
            <li>
              <img src="/assets/icons/MapPin.svg" alt="" />
              <p>São Paulos</p>
            </li>
            <li>
              <img src="/assets/icons/AirplaneTilt.svg" alt="" />
              <p>37 Países</p>
            </li>
            <li>
              <img src="/assets/icons/Image.svg" alt="" />
              <p>240 Fotos</p>
            </li>
          </ul>
        </div>
      </nav>
    </div>
  </body>
</html>
